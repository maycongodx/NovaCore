plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'com.nova.plugins.core'
version = '1.0-SNAPSHOT'

build {
    dependsOn(shadowJar)
}

allprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'
    }
}

dependencies {
    implementation project('novacore-sql-provider:connector')
    implementation project('novacore-sql-provider:executor')
}
